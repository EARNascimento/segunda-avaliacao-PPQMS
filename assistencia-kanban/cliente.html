<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus consertos — Bancada Digital</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
  <div class="marca">Bancada Digital <small>Área do cliente</small></div>
  <nav>
    <span class="quem" id="quem"></span>
    <a class="btn fantasma" href="index.html">Início</a>
    <button class="btn fantasma" id="btnSair" type="button">Sair</button>
  </nav>
</header>

<main class="container">

  <div class="grade-2">
    <!-- ===== Agendamento ===== -->
    <section class="painel" aria-labelledby="tAgendar">
      <h2 id="tAgendar">Agendar conserto</h2>
      <div id="msgSucesso" class="aviso ok" role="status" hidden></div>

      <form id="formAgendar" novalidate>
        <div class="campo">
          <label for="marca">Marca</label>
          <input id="marca" type="text" placeholder="Ex.: Samsung" autocomplete="off">
          <div class="msg-campo" id="erro-marca"></div>
        </div>
        <div class="campo">
          <label for="modelo">Modelo</label>
          <input id="modelo" type="text" placeholder="Ex.: Galaxy A54" autocomplete="off">
          <div class="msg-campo" id="erro-modelo"></div>
        </div>
        <div class="campo">
          <label for="defeito">Defeito</label>
          <textarea id="defeito" rows="3" placeholder="Descreva o que está acontecendo"></textarea>
          <div class="msg-campo" id="erro-defeito"></div>
        </div>
        <div class="campo">
          <label for="data">Dia</label>
          <select id="data"></select>
        </div>
        <div class="campo">
          <label id="lblHora">Horário (riscados estão sem vaga)</label>
          <div class="horarios" id="horarios" role="radiogroup" aria-labelledby="lblHora"></div>
          <div class="msg-campo" id="erro-hora"></div>
        </div>
        <button class="btn" type="submit">Confirmar agendamento</button>
      </form>
    </section>

    <!-- ===== Meus agendamentos ===== -->
    <section class="painel" aria-labelledby="tAgs">
      <h2 id="tAgs">Meus agendamentos</h2>
      <div id="listaAgs"></div>
    </section>
  </div>

  <!-- ===== Acompanhamento ===== -->
  <section class="painel" aria-labelledby="tAcomp">
    <h2 id="tAcomp">Acompanhar meus consertos</h2>
    <form class="busca" id="formBusca" role="search">
      <label for="codigo" class="sr" style="position:absolute;left:-9999px">Código da OS</label>
      <input id="codigo" type="text" placeholder="Buscar pelo código, ex.: #OS-1001" autocomplete="off">
      <button class="btn secundario" type="submit">Buscar</button>
      <button class="btn secundario" type="button" id="btnLimpar">Ver todas</button>
    </form>
    <div id="listaOS"></div>
  </section>

</main>

<script src="js/status.js"></script>
<script src="js/app.js"></script>
<script src="js/cliente.js"></script>
</body>
</html>
